# Job resource — post-deploy validation
# Runs validation notebooks after every deployment to validate:
#   - App is running and reachable
#   - Auth sidecar passes SPN tokens (Layer 1)
#   - All API routes registered (captures, uploads, pairing, zerobus)
#   - Health endpoint responds
#   - ZeroBus env configured, pool health, history endpoints
#   - CAF/AIFF upload acceptance + server-side transcode to M4A
# Triggered by deploy.sh after successful app deploy + migration.
# Raises AssertionError (non-zero exit) on any test failure.

resources:
  jobs:
    post_deploy_validation:
      name: "[lakeLoom] Post-Deploy Validation"
      tags:
        project: ${var.tags_project}
        purpose: ci-validation
        env: ${bundle.target}
      tasks:
        - task_key: api_endpoint_tests
          notebook_task:
            notebook_path: ../src/tests/pairing-api-test.ipynb
          environment_key: default

        - task_key: zerobus_validation
          depends_on:
            - task_key: api_endpoint_tests
          notebook_task:
            notebook_path: ../src/tests/validate-zerobus-ingest.ipynb
            base_parameters:
              app_name: ${var.app_name}
              catalog_use: ${var.catalog}
              schema_use: ${var.schema}
          environment_key: default

        - task_key: caf_transcode_validation
          depends_on:
            - task_key: api_endpoint_tests
          notebook_task:
            notebook_path: ../src/tests/caf-transcode-test.ipynb
            base_parameters:
              app_name: ${var.app_name}
              catalog_use: ${var.catalog}
              schema_use: ${var.schema}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: ${var.serverless_environment_version}
      max_concurrent_runs: 1
